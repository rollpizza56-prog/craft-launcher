# Local build: compiles the launcher for 64-bit Windows and uploads artcraft-launcher.exe.
# Run it from the Actions tab (Build Windows exe > Run workflow), then download the artifact.
name: Build Windows exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p artcraft-launcher
      - uses: actions/upload-artifact@v4
        with:
          name: artcraft-launcher-windows-x64
          path: target/release/artcraft-launcher.exe
